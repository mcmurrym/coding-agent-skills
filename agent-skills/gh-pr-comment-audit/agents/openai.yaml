interface:
  display_name: "GH PR Comment Audit"
  short_description: "Audit PR comments with purpose and scope control"
  default_prompt: "Use $gh-pr-comment-audit to establish the branch purpose, audit all unresolved findings or one targeted/next unresolved comment, analyze upstream and downstream effects before edits, avoid speculative mechanical scope creep, auto-fix only bounded in-scope issues, resolve justified threads, and present ambiguous or non-trivial decisions in chat."
